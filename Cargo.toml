[workspace]
# Real workspace shape (supersedes the `yaesu` agent's minimal placeholder,
# which only listed `members = ["radio"]"` to give that crate a workspace
# root to build/test/lint against). This is the `app` agent's Wave 1 Task 2
# deliverable — see `planning/architect/task_plan.md` §1/§5 and
# `planning/app/task_plan.md`.
#
# `emulator` added in Wave 2 per `planning/architect/task_plan.md` §7 — see
# `planning/emulator/task_plan.md` for that crate's design.
#
# `server` added in Wave 5 per `planning/architect/task_plan.md` §12 — the
# network server mode (raw `cat-server` TCP/UDP + a new rigctld-compatible
# TCP listener for WSJT-X). Linux-only (see that crate's own Cargo.toml
# doc comment) — the `ft991a` binary only depends on it under
# `cfg(target_os = "linux")`, so it never affects the Windows cross-check.
members = ["radio", "ui", "emulator", "server", "gui"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["Matt Franklin <radiombf@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/kf0uwv/ft991a"
repository = "https://github.com/kf0uwv/ft991a"
description = "Yaesu FT-991A Radio Control with io_uring"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime (io_uring-based, Linux-only) — same pin as ts570d/Cargo.toml
monoio = { version = "0.2.3" }
local-sync = "0.1.1"

# Async trait support (compatible with !Send futures for monoio)
async-trait = "0.1"

# Terminal UI (centralized here for Wave 2's real ratatui TUI; the Wave 1
# `ui` crate stub does not use these yet)
ratatui = { version = "0.26.3", features = ["crossterm"] }
crossterm = { version = "0.27.0", features = ["event-stream"] }

# Error handling
thiserror = "1.0.61"

# Serialization (for radio commands/protocols)
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
# Profile file format (radio/src/profile.rs) — human-editable settings bundles.
toml = "0.8.19"

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Utilities
bytes = "1.6.0"
futures = "0.3.30"

# Linux-specific
libc = "0.2.153"
nix = "0.27.1"

# Testing
tempfile = "3.10.1"
mockall = "0.12.1"

# Generic CAT engine + transports, from https://github.com/kf0uwv/radio-cat-rs
# (see docs/adr/0001-second-radio-on-shared-cat-framework.md). Pinned to the
# v0.1.0 release tag (rather than floating on `branch = "main"`) so this
# app's build is reproducible against a known-good, released snapshot of
# the shared library instead of whatever happens to be on that repo's main
# branch at build time.
cat-framework = { path = "../radio-cat-rs/cat-framework" }
cat-ui = { path = "../radio-cat-rs/cat-ui" }
cat-ui-ratatui = { path = "../radio-cat-rs/cat-ui-ratatui" }
cat-client = { path = "../radio-cat-rs/cat-client" }
cat-transport-core = { path = "../radio-cat-rs/cat-transport-core" }
cat-transport-serial = { path = "../radio-cat-rs/cat-transport-serial" }
# Server mode only (Wave 5, `server` crate) — the request broker + raw
# TCP/UDP listeners.
cat-transport-tcp = { path = "../radio-cat-rs/cat-transport-tcp" }
cat-transport-udp = { path = "../radio-cat-rs/cat-transport-udp" }
cat-server = { path = "../radio-cat-rs/cat-server" }
# Generic Hamlib rigctld-compatible TCP bridge + network-server
# orchestration (`server` crate), radio-independent behind the
# `RigctlRadio` trait. Replaces this app's previously hand-rolled
# `server/src/rigctl.rs` + `server/src/lib.rs::run()`.
cat-rigctl = { path = "../radio-cat-rs/cat-rigctl" }
# The console protocol and the shared egui console. New in radio-cat-rs
# and not yet in a release this repo pins, so they are path dependencies
# and the [patch] below points every other radio-cat-rs crate at the same
# local checkout -- otherwise two copies of cat-framework would exist and
# a `RadioCapabilities` from one would not satisfy the other.
# TEMPORARY: revert to a tagged git dependency once radio-cat-rs cuts the
# release containing them.
cat-native = { path = "../radio-cat-rs/cat-native" }
cat-layout = { path = "../radio-cat-rs/cat-layout" }
cat-signal = { path = "../radio-cat-rs/cat-signal" }
cat-ui-egui = { path = "../radio-cat-rs/cat-ui-egui" }

# The GPU console's window and event loop. `eframe` belongs to the binary,
# not to the widget crate (radio-cat-rs ADR 0011's seam), which is why it
# appears here and not in `cat-ui-egui`.
eframe = { version = "0.29", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "0.29"

[package]
name = "ft991a"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
rust-version.workspace = true

[[bin]]
name = "ft991a"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }

# CAT transport crate — provides SerialCatSession/SerialConfig/SerialPort,
# used unconditionally (Windows-buildable per ADR 0004).
cat-transport-serial = { workspace = true }

# TCP client mode (`--server <host:port>`, `planning/app/task_plan.md`'s
# Wave 4 task). Used unconditionally (Windows-buildable) as of
# `radio-cat-rs` ADR 0006: `cat-transport-tcp::TcpCatSession` gained a real
# Windows backend (a dedicated worker thread + the shared `completion`
# primitive), the same shape ADR 0004 already gave
# `cat-transport-serial` — same public API on both platforms, no
# `cfg`-branching needed here anymore. cat-transport-core/async-trait are
# named directly only for `TcpClientSession` (main.rs), the `Ft991a<S>`-
# bound adapter this needs — everywhere else they're transitive.
cat-transport-core = { workspace = true }
cat-transport-tcp = { workspace = true }
async-trait = { workspace = true }

# Local workspace crates
radio = { path = "radio" }
ui = { path = "ui" }

# Server mode (Wave 5, §12.2). Used unconditionally (Windows-buildable) as
# of `radio-cat-rs` docs/adr/0006-windows-network-transport.md's 2026-07-26
# amendment: `cat-rigctl` (which `server` wraps) gained a real Windows
# backend, closing the one remaining gap that previously kept this crate
# Linux-only even after `cat-transport-tcp`/`cat-transport-udp`/`cat-server`
# themselves became cross-platform. `main.rs`'s `server` subcommand handling
# is no longer platform-gated to match.
server = { path = "server" }

[dev-dependencies]
radio = { path = "radio" }
cat-transport-serial = { workspace = true }

[features]
default = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true

# Platform-specific configuration
[target.'cfg(target_os = "linux")'.dependencies]
# Async runtime (io_uring-based, Linux-only — monoio cannot compile on
# Windows at all). Target-gated per docs/adr/0004-windows-serial-backend.md
# (radio-cat-rs), mirroring cat-transport-serial's own gating of the same
# dependency exactly.
monoio = { workspace = true }
# libc is already included above, unconditionally (portable itself)

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Test-only monoio usage (#[monoio::main]-driven smoke tests, if any land
# here later) — same Linux-only gating as the runtime dependency above.
monoio = { workspace = true }
# The emulator is fundamentally Unix-only (pseudo-terminals via
# serialport::TTYPort, std::os::unix::io::AsRawFd), so it is not part of
# this repo's Windows support at all. Only tests/integration.rs uses it,
# and that file is itself Linux-gated.
#
# This was an UNCONDITIONAL dev-dependency until 2026-08-27. It went
# unnoticed because the old Windows CI job ran `cargo check -p ft991a`,
# which builds no dev-dependencies; widening the job to `cargo test
# --workspace` broke it immediately. Note that `--exclude emulator` does
# NOT help here -- that drops it as a tested *package*, not as a
# dependency of this one. `ts570d` has always had this gating; this repo
# was the outlier.
emulator = { path = "emulator" }

# Metadata for documentation and packaging
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

# Build requirements documentation
[package.metadata.build]
# Note: This application requires Linux kernel 5.1+ for io_uring support
# Build command: cargo build --release
# Test command: cargo test
# Lint command: cargo clippy && cargo fmt


# TEMPORARY. `ts570d` reaches radio-cat-rs by tagged git dependency with a
# [patch] pointing at the sibling checkout; this repo cannot, because the
# tag it pinned (v0.3.0) predates the crates this port needs and a
# [patch] only substitutes for a matching version. Path dependencies say
# the same thing without the indirection: one copy of every shared crate,
# taken from the checkout next door.
#
# Revert to tagged git dependencies when radio-cat-rs cuts the release
# containing `cat-native`, `cat-ui-egui`, and the console protocol.
