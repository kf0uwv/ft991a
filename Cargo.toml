[workspace]
# Real workspace shape (supersedes the `yaesu` agent's minimal placeholder,
# which only listed `members = ["radio"]"` to give that crate a workspace
# root to build/test/lint against). This is the `app` agent's Wave 1 Task 2
# deliverable — see `planning/architect/task_plan.md` §1/§5 and
# `planning/app/task_plan.md`.
#
# `emulator` added in Wave 2 per `planning/architect/task_plan.md` §7 — see
# `planning/emulator/task_plan.md` for that crate's design.
#
# `server` added in Wave 5 per `planning/architect/task_plan.md` §12 — the
# network server mode (raw `cat-server` TCP/UDP + a new rigctld-compatible
# TCP listener for WSJT-X). Linux-only (see that crate's own Cargo.toml
# doc comment) — the `ft991a` binary only depends on it under
# `cfg(target_os = "linux")`, so it never affects the Windows cross-check.
members = ["radio", "ui", "emulator", "server"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Matt Franklin <radiombf@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/kf0uwv/ft991a"
repository = "https://github.com/kf0uwv/ft991a"
description = "Yaesu FT-991A Radio Control with io_uring"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime (io_uring-based, Linux-only) — same pin as ts570d/Cargo.toml
monoio = { version = "0.2.3" }
local-sync = "0.1.1"

# Async trait support (compatible with !Send futures for monoio)
async-trait = "0.1"

# Terminal UI (centralized here for Wave 2's real ratatui TUI; the Wave 1
# `ui` crate stub does not use these yet)
ratatui = { version = "0.26.3", features = ["crossterm"] }
crossterm = { version = "0.27.0", features = ["event-stream"] }

# Error handling
thiserror = "1.0.61"

# Serialization (for radio commands/protocols)
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
# Profile file format (radio/src/profile.rs) — human-editable settings bundles.
toml = "0.8.19"

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Utilities
bytes = "1.6.0"
futures = "0.3.30"

# Linux-specific
libc = "0.2.153"
nix = "0.27.1"

# Testing
tempfile = "3.10.1"
mockall = "0.12.1"

# Generic CAT engine + transports, from https://github.com/kf0uwv/radio-cat-rs
# (see docs/adr/0001-second-radio-on-shared-cat-framework.md). Floating on
# `branch = "main"` while both repos co-evolve pre-1.0, mirroring
# ts570d/Cargo.toml's dependency syntax exactly.
cat-framework = { git = "https://github.com/kf0uwv/radio-cat-rs", branch = "main" }
cat-client = { git = "https://github.com/kf0uwv/radio-cat-rs", branch = "main" }
cat-transport-core = { git = "https://github.com/kf0uwv/radio-cat-rs", branch = "main" }
cat-transport-serial = { git = "https://github.com/kf0uwv/radio-cat-rs", branch = "main" }
# Server mode only (Wave 5, `server` crate) — the request broker + raw
# TCP/UDP listeners. Linux-only, per `cat-server`'s own Cargo.toml.
cat-transport-tcp = { git = "https://github.com/kf0uwv/radio-cat-rs", branch = "main" }
cat-transport-udp = { git = "https://github.com/kf0uwv/radio-cat-rs", branch = "main" }
cat-server = { git = "https://github.com/kf0uwv/radio-cat-rs", branch = "main" }
# Generic Hamlib rigctld-compatible TCP bridge + network-server
# orchestration (`server` crate), radio-independent behind the
# `RigctlRadio` trait. Replaces this app's previously hand-rolled
# `server/src/rigctl.rs` + `server/src/lib.rs::run()`.
cat-rigctl = { git = "https://github.com/kf0uwv/radio-cat-rs", branch = "main" }
# Shared, radio-independent diagnostics/self-test engine (ADR 0007,
# radio-cat-rs). Consumed by `ui`'s new diagnostics screen — see
# docs/adr/0003-shared-diagnostics-screen.md.
cat-diagnostics = { git = "https://github.com/kf0uwv/radio-cat-rs", branch = "main" }

# ---------------------------------------------------------------------------
# TEMPORARY: local path patch, to be removed once radio-cat-rs's `main` is
# actually pushed to GitHub and the `branch = "main"` deps above re-resolve
# against the real upstream commit.
#
# radio-cat-rs's ADR 0006/0007/0008 work (Windows network transport for
# cat-transport-tcp/udp/cat-server, the new cat-diagnostics crate, the
# shared cat-transport-serial `pin-test` binary, `NoModemControlLines`, the
# shared release workflow) exists only as LOCAL commits on that sibling
# repo's own `main` branch (verified via `git log` there, HEAD `cffd430`) —
# it has not been pushed to `https://github.com/kf0uwv/radio-cat-rs`. Without
# this patch, every `branch = "main"` git dependency above would silently
# resolve against the old, unmodified *remote* main and miss all of it.
#
# Remove this whole `[patch]` table (and switch back to relying solely on
# the `branch = "main"` git deps above) once a human has pushed
# radio-cat-rs's `main` branch upstream.
[patch."https://github.com/kf0uwv/radio-cat-rs"]
cat-framework = { path = "../radio-cat-rs/cat-framework" }
cat-client = { path = "../radio-cat-rs/cat-client" }
cat-transport-core = { path = "../radio-cat-rs/cat-transport-core" }
cat-transport-serial = { path = "../radio-cat-rs/cat-transport-serial" }
cat-transport-tcp = { path = "../radio-cat-rs/cat-transport-tcp" }
cat-transport-udp = { path = "../radio-cat-rs/cat-transport-udp" }
cat-server = { path = "../radio-cat-rs/cat-server" }
cat-rigctl = { path = "../radio-cat-rs/cat-rigctl" }
cat-diagnostics = { path = "../radio-cat-rs/cat-diagnostics" }

[package]
name = "ft991a"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
rust-version.workspace = true

[[bin]]
name = "ft991a"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }

# CAT transport crate — provides SerialCatSession/SerialConfig/SerialPort,
# used unconditionally (Windows-buildable per ADR 0004). cat-transport-tcp
# backs `--server <host:port>` (TCP client mode) and is Linux-only today
# (its `TcpCatSession` is built directly on `monoio::net::TcpStream`, with
# no Windows backend upstream in radio-cat-rs the way cat-transport-serial
# got one) — target-gated below to match, so the Windows cross-compile
# check never tries to build it. cat-transport-core/async-trait are named
# directly only for that same Linux-only TCP client adapter (see
# `TcpClientSession` in main.rs) — everywhere else they're transitive.
cat-transport-serial = { workspace = true }

# Local workspace crates
radio = { path = "radio" }
ui = { path = "ui" }

[dev-dependencies]
emulator = { path = "emulator" }
radio = { path = "radio" }
cat-transport-serial = { workspace = true }

[features]
default = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true

# Platform-specific configuration
[target.'cfg(target_os = "linux")'.dependencies]
# Async runtime (io_uring-based, Linux-only — monoio cannot compile on
# Windows at all). Target-gated per docs/adr/0004-windows-serial-backend.md
# (radio-cat-rs), mirroring cat-transport-serial's own gating of the same
# dependency exactly.
monoio = { workspace = true }
# libc is already included above, unconditionally (portable itself)

# Server mode (Wave 5, §12.2) — Linux-only (see `server/Cargo.toml`'s own
# doc comment), so this is gated here rather than in the unconditional
# `[dependencies]` above: `cargo check --target x86_64-pc-windows-gnu -p
# ft991a` (an existing, must-keep-green command) must never try to pull it
# in. `main.rs`'s `server` subcommand handling is itself
# `#[cfg(target_os = "linux")]`-gated to match.
server = { path = "server" }

# TCP client mode (`--server <host:port>`, `planning/app/task_plan.md`'s
# Wave 4 task) — Linux-only: `cat-transport-tcp::TcpCatSession` is built
# directly on `monoio::net::TcpStream` with no Windows backend upstream in
# radio-cat-rs (unlike cat-transport-serial, which got a real Win32 COM
# backend per ADR 0004), and its own Cargo.toml only pulls in `monoio` on
# Linux — so gated here to match, same reasoning as `server` above.
# cat-transport-core/async-trait are named directly only for
# `TcpClientSession` (main.rs), the `Ft991a<S>`-bound adapter this needs.
cat-transport-core = { workspace = true }
cat-transport-tcp = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Test-only monoio usage (#[monoio::main]-driven smoke tests, if any land
# here later) — same Linux-only gating as the runtime dependency above.
monoio = { workspace = true }

# Metadata for documentation and packaging
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

# Build requirements documentation
[package.metadata.build]
# Note: This application requires Linux kernel 5.1+ for io_uring support
# Build command: cargo build --release
# Test command: cargo test
# Lint command: cargo clippy && cargo fmt
