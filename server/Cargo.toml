[package]
name = "server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Network server mode: one process owns the physical serial port, exposed to WSJT-X and other remote clients over TCP/UDP."
rust-version.workspace = true

# Cross-platform since `radio-cat-rs` docs/adr/0006-windows-network-
# transport.md's 2026-07-26 amendment: `cat-rigctl` (the rigctld bridge +
# listener orchestration this crate's `run()` wraps via `cat_rigctl::run`)
# gained a real Windows backend (`std::net` + genuine OS threads, mirroring
# `cat-server`'s own), closing the gap that previously kept this crate
# Linux-only even after `cat-transport-tcp`/`cat-transport-udp`/
# `cat-server` themselves became cross-platform. `run()` below is
# `#[cfg]`-selected per platform to match `cat_rigctl::run`'s own split
# (`async fn` on Linux, a plain blocking `fn` on Windows, since
# `#[monoio::main]` cannot exist there).

[dependencies]
# FT-991A command table + client + domain types — this crate is
# contractually FT-991A-shaped (like `ui`), not radio-generic: the rigctld
# bridge calls `radio::Ft991a`'s typed methods directly (via
# `rigctl_radio::Ft991aRigctl`).
radio = { path = "../radio" }

# `CatSession`/`TransportError` — the bound `Ft991aRigctl<S>`/this crate's
# `run()` wrapper are generic over.
cat-transport-core = { workspace = true }

# Generic rigctld bridge (dispatch/dump_state/framing, listener
# orchestration/error propagation) behind `RigctlRadio` — this crate now
# only supplies the FT-991A-specific `RigctlRadio` impl
# (`src/rigctl_radio.rs`, via the local `Ft991aRigctl<S>` wrapper — see its
# doc comment for why a wrapper is needed) and a thin `run()` wrapper.
cat-rigctl = { workspace = true }

# Async traits (compatible with !Send futures for monoio) — `Ft991aRigctl`'s
# `impl RigctlRadio` is `#[async_trait(?Send)]`.
async-trait = { workspace = true }

[features]
default = []

[dev-dependencies]
# Runtime-agnostic test executor. `rigctl_radio`'s tests are pure
# delegation checks against a ScriptedCatSession -- no io_uring -- and had
# been using `#[monoio::test]` as nothing but a `block_on`, which broke the
# whole Windows test target because `monoio` is Linux-only. Same defect and
# same fix as `radio-cat-rs` (its planning/release_workflow/findings.md
# section 7a). `lib.rs`'s test module is different: it genuinely exercises
# the Linux `async fn run`, and stays `#[cfg(all(test, target_os =
# "linux"))]`.
futures = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Async runtime (io_uring-based, Linux-only) — named directly for
# `#[monoio::test]` in this crate's own unit tests, which only exercise the
# Linux `run()` (an `async fn`); the Windows `run()` is a plain blocking
# `fn` with no `monoio` dependency of its own.
monoio = { workspace = true }
