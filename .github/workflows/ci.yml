name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --lib

      - name: Integration tests
        # Requires /dev/pts (ptmx) and io_uring (kernel 5.1+).
        # ubuntu-latest runs kernel 6.x so both are available.
        run: cargo test --test integration

  windows-check:
    name: Windows (MSVC)
    runs-on: windows-latest

    # Authoritative Windows verification, per `radio-cat-rs` ADR 0012.
    #
    # Supersedes the previous `cargo check --target x86_64-pc-windows-gnu
    # -p ft991a` cross-check on an Ubuntu runner, which differed from this
    # job in three ways, all of them now fixed:
    #
    #   1. It targeted `-gnu`, which is not what the release workflow
    #      packages. `x86_64-pc-windows-msvc` is the host target on
    #      `windows-latest`, so no `--target` flag is needed or wanted.
    #   2. It type-checked only. This builds and runs the test suite.
    #   3. It was scoped to `-p ft991a` on the grounds that `server` was
    #      "genuinely not Windows-buildable yet" because `cat-rigctl` had
    #      no Windows backend. That justification went stale on 2026-07-26,
    #      when `cat-rigctl` gained one (see this repo's Cargo.toml comment
    #      on the `server` dependency, and `radio-cat-rs` ADR 0006's
    #      amendment). The scope is now the whole workspace.
    #
    # `emulator` is excluded: its virtual-TTY PTY hosting is Unix-only by
    # design, not by toolchain.
    #
    # These tests have never executed on Windows before. Failures are
    # pre-existing bugs, not regressions from this migration.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-windows-msvc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-msvc-
            ${{ runner.os }}-cargo-

      - name: cargo check (workspace, excluding emulator)
        run: cargo check --workspace --exclude emulator

      - name: cargo test (workspace, excluding emulator)
        run: cargo test --workspace --exclude emulator
