[package]
name = "radio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Yaesu FT-991A protocol handling"
rust-version.workspace = true

[dependencies]
# Generic CAT engine + client mechanics, external from radio-cat-rs — see
# docs/adr/0001-second-radio-on-shared-cat-framework.md.
cat-framework = { workspace = true }
cat-client = { workspace = true }
cat-transport-core = { workspace = true }
# Shared, radio-generic diagnostics/self-test engine (radio-cat-rs ADR
# 0007) — wrapped here, not called directly from `ui`, because
# `cat_diagnostics::run_diagnostics_with` needs a concrete `&mut
# CatClient<C, S>`, which `ui` never has access to (`ui::run`'s generic `R:
# Radio + Ft991aExtras + CwKeying` bound only ever sees trait-object-free
# generic values, never the concrete `Ft991a<S>` struct or its `pub(crate)
# client` field) — see `docs/adr/0004-shared-diagnostics-screen.md` and
# `src/diagnostics.rs`'s module doc comment.
cat-diagnostics = { workspace = true }

# Runtime
monoio = { workspace = true }

# Async traits
async-trait = "0.1"

# Error handling
thiserror = { workspace = true }

# Profile file format (settings bundles applied together) — plain data
# deserialization only, never wire-format serialization of protocol types.
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
mockall = { workspace = true }
# Test-only: wire-framing-level unit tests. Never used by production code
# (radio never depends on a concrete transport crate).
cat-transport-serial = { workspace = true }

[features]
default = []
